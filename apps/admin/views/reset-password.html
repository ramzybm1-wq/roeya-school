<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Définir un nouveau mot de passe — VISION SCHOOL</title>
  <link rel="stylesheet" href="/public/css/design-system.css"/>
  <style>
    .strength-bar {
      height: 4px;
      flex: 1;
      border-radius: var(--r-full);
      background: var(--border);
      transition: background var(--t-normal);
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-card animate-fadeIn">
    <!-- Brand Header -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <span class="material-symbols-outlined">password</span>
      </div>
      <div>
        <div class="auth-logo-name">VISION SCHOOL</div>
        <div class="auth-logo-sub">Nouveau mot de passe</div>
      </div>
    </div>

    <h1 class="auth-title">Sécuriser votre compte</h1>
    <p class="auth-desc">Définissez un nouveau mot de passe robuste d'au moins 8 caractères.</p>

    <div id="reset-status" class="alert hidden mb-4" role="alert"></div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label form-label-required" for="new-password">Nouveau mot de passe</label>
        <div class="input-password-wrap">
          <input class="form-control" id="new-password" name="new-password" type="password" placeholder="••••••••" required/>
          <button type="button" id="toggle-new-pw" class="btn-password-toggle">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <!-- Strength Bar -->
      <div class="form-group mb-3">
        <div class="flex items-center justify-between text-xs text-muted mb-1">
          <span>Solidité :</span>
          <span id="strength-label" class="font-medium">Faible</span>
        </div>
        <div class="flex gap-2">
          <div id="str-bar-1" class="strength-bar"></div>
          <div id="str-bar-2" class="strength-bar"></div>
          <div id="str-bar-3" class="strength-bar"></div>
          <div id="str-bar-4" class="strength-bar"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label form-label-required" for="confirm-password">Confirmer le mot de passe</label>
        <div class="input-password-wrap">
          <input class="form-control" id="confirm-password" name="confirm-password" type="password" placeholder="••••••••" required/>
          <button type="button" id="toggle-confirm-pw" class="btn-password-toggle">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <button id="btn-reset-submit" class="btn btn-primary btn-lg w-full mb-3" type="submit">
        <span>Enregistrer le mot de passe</span>
        <span class="material-symbols-outlined">check</span>
      </button>
    </form>

    <div class="divider"></div>

    <div class="text-center">
      <a class="text-sm text-muted hover:text-primary-color flex items-center justify-center gap-1" href="/login">
        <span class="material-symbols-outlined" style="font-size:17px;">arrow_back</span>
        <span>Retour à la page de connexion</span>
      </a>
    </div>
  </main>

  <script>
    const pw = document.getElementById('new-password');
    const label = document.getElementById('strength-label');
    const bars = [document.getElementById('str-bar-1'), document.getElementById('str-bar-2'), document.getElementById('str-bar-3'), document.getElementById('str-bar-4')];

    pw.addEventListener('input', () => {
      const val = pw.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['#dc2626', '#d97706', '#0284c7', '#059669'];
      const labels = ['Faible', 'Moyen', 'Bon', 'Excellent'];

      bars.forEach((b, i) => {
        if (i < score) {
          b.style.background = colors[score - 1];
        } else {
          b.style.background = 'var(--border)';
        }
      });
      label.textContent = score > 0 ? labels[score - 1] : 'Faible';
      label.style.color = score > 0 ? colors[score - 1] : 'var(--text-muted)';
    });

    function setupToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn.addEventListener('click', () => {
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        btn.querySelector('.material-symbols-outlined').textContent = isPw ? 'visibility_off' : 'visibility';
      });
    }
    setupToggle('toggle-new-pw', 'new-password');
    setupToggle('toggle-confirm-pw', 'confirm-password');
  </script>
</body>
</html>
