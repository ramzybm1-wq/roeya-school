<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mot de passe oublié — VISION SCHOOL</title>
  <link rel="stylesheet" href="/public/css/design-system.css"/>
</head>
<body class="auth-page">
  <main class="auth-card animate-fadeIn">
    <!-- Brand Header -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <div>
        <div class="auth-logo-name">VISION SCHOOL</div>
        <div class="auth-logo-sub">Récupération de compte</div>
      </div>
    </div>

    <h1 class="auth-title">Mot de passe oublié</h1>
    <p class="auth-desc">
      Saisissez votre adresse email institutionnelle. Si un compte existe, un lien de réinitialisation sécurisé vous sera envoyé.
    </p>

    <!-- Status Alert Container -->
    <div id="forgot-status" class="alert hidden mb-4" role="alert"></div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label form-label-required" for="email">Adresse email</label>
        <div class="search-input-wrap">
          <span class="material-symbols-outlined">mail</span>
          <input 
            class="form-control" 
            id="email" 
            name="email" 
            type="email" 
            placeholder="admin@visionschool.dz" 
            required
            autocomplete="email"
          />
        </div>
      </div>

      <button id="btn-forgot-submit" class="btn btn-primary btn-lg w-full mb-3" type="submit">
        <span id="btn-forgot-text">Envoyer le lien</span>
        <span class="material-symbols-outlined">send</span>
      </button>
    </form>

    <div class="divider"></div>

    <div class="text-center">
      <a class="text-sm font-medium flex items-center justify-center gap-1 text-muted hover:text-primary-color" href="/login">
        <span class="material-symbols-outlined" style="font-size: 17px;">arrow_back</span>
        <span>Retour à la connexion</span>
      </a>
    </div>
  </main>
</body>
</html>
