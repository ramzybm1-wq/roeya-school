services:
  postgres:
    image: postgres:16-alpine
    container_name: vision_school_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision_school}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vision_school_api
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3001}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/storage
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: vision_school_admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json
    ports:
      - "3001:3001"
    depends_on:
      - api

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: vision_school_client
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./apps/client:/app/apps/client
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
